spring:
  application:
    name: "moayo-backend"

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

file:
  storage:
    path: ./uploads

ai:
  openai:
    enabled: true
    base-url: https://api.openai.com
    api-key: ${OPENAI_API_KEY:}
    model: gpt-4o-mini
    timeout-ms: 15000

app:
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:empty_id}
      client-secret: ${GOOGLE_CLIENT_SECRET:empty_secret}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth/google/callback}
      scope: "openid email profile"

  jwt:
    issuer: "moayo"
    secret: ${JWT_SECRET:very_long_dummy_secret_key_for_build_success}
    access-token-ttl-seconds: 2592000
    refresh-token-ttl-seconds: 1209600

  front:
    redirect-url: ${FRONT_REDIRECT_URL:http://localhost:5173/auth/callback}

  cookie:
    secure: ${COOKIE_SECURE:false}

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG         # SQL 문 확인
    com.moayo.moayobackend: TRACE   # 우리 코드의 아주 상세한 로그까지 확인