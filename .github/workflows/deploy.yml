name: Deploy to EC2 with Docker

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Docker build & push
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -t ${{ secrets.DOCKER_USERNAME }}/moayo .
          docker push ${{ secrets.DOCKER_USERNAME }}/moayo

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo docker rm -f moayo-server || true
            sudo docker pull baesuhyun/moayo
            sudo docker run -d --network host --name moayo-server \
              -v /home/ec2-user/moayo_uploads:/uploads \
              -e DB_URL="${{ secrets.DB_URL }}" \
              -e DB_USER="${{ secrets.DB_USER }}" \
              -e DB_PW="${{ secrets.DB_PW }}" \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e GOOGLE_REDIRECT_URI="https://moayo-backend.p-e.kr/api/v1/auth/oauth/google/callback" \
              -e FRONT_REDIRECT_URL="${{ secrets.FRONT_REDIRECT_URL }}" \
              -e COOKIE_SECURE="true" \
              -e AI_OPENAI_ENABLED="true" \
              -e AI_OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e AI_OPENAI_BASE_URL="https://api.openai.com/v1" \
              -e AI_OPENAI_MODEL="gpt-4o-mini" \
              baesuhyun/moayo