name: Deploy to EC2 with Docker

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Docker build & push
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -t ${{ secrets.DOCKER_USERNAME }}/moayo .
          docker push ${{ secrets.DOCKER_USERNAME }}/moayo

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker rm -f moayo-server || true
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/moayo
            sudo docker run -d -p 80:8080 --name moayo-server \
              -e DB_URL="jdbc:mysql://moayo-db.cjcae66k8tk7.ap-northeast-2.rds.amazonaws.com:3306/moayo?createDatabaseIfNotExist=true" \
              -e DB_USER="suhyun" \
              -e DB_PW="moayo123" \
              ${{ secrets.DOCKER_USERNAME }}/moayo