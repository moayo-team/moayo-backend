name: CI

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 17 설정 (프로젝트 자바 버전에 맞게 수정 가능)
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Gradle 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. 빌드 및 테스트 실행
      # -Dspring.profiles.active=test 옵션을 통해
      # 테스트 시에는 무조건 application-test.yml(H2 설정)을 사용하게 강제합니다.
      - name: Build & Test
        run: ./gradlew clean build -Dspring.profiles.active=test
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_URL: jdbc:h2:mem:testdb;MODE=MySQL
          DB_USER: sa
          DB_PW: ""
          DB_DRIVER: org.h2.Driver
#        run: ./gradlew clean build
